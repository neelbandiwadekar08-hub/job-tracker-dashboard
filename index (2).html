    // ==========================================
    // 3. HAND-BUILT SANKEY SVG SUBCOMPONENT
    // ==========================================
    const CustomSankeyChart = ({ applications, isDark, selectedStageFilter, onSelectStage }) => {
      const [hoveredNodeId, setHoveredNodeId] = useState(null);
      const [hoveredLinkId, setHoveredLinkId] = useState(null);
      const [tooltip, setTooltip] = useState({ show: false, x: 0, y: 0, label: '', value: 0 });
      const themePalette = PALETTE[isDark ? 'dark' : 'light'];

      // FIXED CANVAS DIMENSIONS - Size NEVER changes on filter or data update
      const SVG_WIDTH = 1000;
      const SVG_HEIGHT = 420;
      // Increased left margin so first column label fits, and enough right margin for last column
      const MARGIN = { top: 45, right: 120, bottom: 35, left: 60 };
      const NODE_WIDTH = 22;

      // Deterministic layout calculations
      const { nodes, links, totalApps } = useMemo(() => {
        const total = applications.length;
        if (total === 0) return { nodes: [], links: [], totalApps: 0 };

        // Stage Counts
        const appliedPending = applications.filter((a) => a.stage === 'Applied').length;
        const rejected = applications.filter((a) => a.stage === 'Rejected').length;
        const noAnswer = applications.filter((a) => a.stage === 'No Answer').length;

        // Interview branch includes: Interview, No Offer, Offer, Accepted, Declined
        const reachedInterview = applications.filter((a) =>
          ['Interview', 'No Offer', 'Offer', 'Accepted', 'Declined'].includes(a.stage)
        ).length;

        const interviewingActive = applications.filter((a) => a.stage === 'Interview').length;
        const noOffer = applications.filter((a) => a.stage === 'No Offer').length;

        // Offer branch includes: Offer, Accepted, Declined
        const reachedOffer = applications.filter((a) =>
          ['Offer', 'Accepted', 'Declined'].includes(a.stage)
        ).length;

        const offerPending = applications.filter((a) => a.stage === 'Offer').length;
        const accepted = applications.filter((a) => a.stage === 'Accepted').length;
        const declined = applications.filter((a) => a.stage === 'Declined').length;

        // Raw Node definitions across 4 level columns
        const rawNodes = [
          // Column 0
          { id: 'root', name: 'Applications', count: total, col: 0, colorKey: 'total' },

          // Column 1
          { id: 'col1-applied', name: 'Applied', count: appliedPending, col: 1, colorKey: 'Applied' },
          { id: 'col1-rejected', name: 'Rejected', count: rejected, col: 1, colorKey: 'Rejected' },
          { id: 'col1-noanswer', name: 'No Answer', count: noAnswer, col: 1, colorKey: 'No Answer' },
          { id: 'col1-interview', name: 'Interview', count: reachedInterview, col: 1, colorKey: 'Interview' },

          // Column 2
          { id: 'col2-interviewing', name: 'Interviewing', count: interviewingActive, col: 2, colorKey: 'InterviewingActive' },
          { id: 'col2-nooffer', name: 'No Offer', count: noOffer, col: 2, colorKey: 'No Offer' },
          { id: 'col2-offer', name: 'Offer', count: reachedOffer, col: 2, colorKey: 'Offer' },

          // Column 3
          { id: 'col3-pendingoffer', name: 'Offer Received', count: offerPending, col: 3, colorKey: 'OfferPending' },
          { id: 'col3-accepted', name: 'Accepted', count: accepted, col: 3, colorKey: 'Accepted' },
          { id: 'col3-declined', name: 'Declined', count: declined, col: 3, colorKey: 'Declined' },
        ];

        // HIDE BRANCHES/NODES WITH COUNT OF 0 (No ghost nodes)
        const activeNodes = rawNodes.filter((n) => n.count > 0);

        // Link definitions
        const rawLinks = [
          // Col 0 -> Col 1
          { source: 'root', target: 'col1-applied', value: appliedPending, colorKey: 'Applied' },
          { source: 'root', target: 'col1-rejected', value: rejected, colorKey: 'Rejected' },
          { source: 'root', target: 'col1-noanswer', value: noAnswer, colorKey: 'No Answer' },
          { source: 'root', target: 'col1-interview', value: reachedInterview, colorKey: 'Interview' },

          // Col 1 -> Col 2
          { source: 'col1-interview', target: 'col2-interviewing', value: interviewingActive, colorKey: 'InterviewingActive' },
          { source: 'col1-interview', target: 'col2-nooffer', value: noOffer, colorKey: 'No Offer' },
          { source: 'col1-interview', target: 'col2-offer', value: reachedOffer, colorKey: 'Offer' },

          // Col 2 -> Col 3
          { source: 'col2-offer', target: 'col3-pendingoffer', value: offerPending, colorKey: 'OfferPending' },
          { source: 'col2-offer', target: 'col3-accepted', value: accepted, colorKey: 'Accepted' },
          { source: 'col2-offer', target: 'col3-declined', value: declined, colorKey: 'Declined' },
        ].filter((l) => l.value > 0);

        // Geometry Math
        const availWidth = SVG_WIDTH - MARGIN.left - MARGIN.right;
        const availHeight = SVG_HEIGHT - MARGIN.top - MARGIN.bottom;
        const colStep = availWidth / 3;

        // Scale factor: canvas available height mapped to total applications count
        const scale = availHeight / total;

        // Stack nodes inside columns
        const colsMap = { 0: [], 1: [], 2: [], 3: [] };
        activeNodes.forEach((n) => colsMap[n.col].push(n));

        const computedNodesMap = new Map();
        const nodeGap = 16; // vertical gap in px

        [0, 1, 2, 3].forEach((c) => {
          const colNodes = colsMap[c];
          if (colNodes.length === 0) return;

          const totalGap = (colNodes.length - 1) * nodeGap;
          const totalColCount = colNodes.reduce((acc, curr) => acc + curr.count, 0);
          const totalColHeight = totalColCount * scale;

          let currentY = MARGIN.top + (availHeight - (totalColHeight + totalGap)) / 2;
          const x = MARGIN.left + c * colStep - NODE_WIDTH / 2;

          colNodes.forEach((n) => {
            const h = Math.max(12, n.count * scale);
            const nodeObj = {
              id: n.id,
              name: n.name,
              count: n.count,
              column: n.col,
              colorKey: n.colorKey,
              x,
              y: currentY,
              width: NODE_WIDTH,
              height: h,
            };
            computedNodesMap.set(n.id, nodeObj);
            currentY += h + nodeGap;
          });
        });

        // Track Y offsets for rendering link ribbons
        const sourceOffsets = new Map();
        const targetOffsets = new Map();

        computedNodesMap.forEach((n) => {
          sourceOffsets.set(n.id, n.y);
          targetOffsets.set(n.id, n.y);
        });

        const computedLinks = [];
        rawLinks.forEach((link) => {
          const src = computedNodesMap.get(link.source);
          const tgt = computedNodesMap.get(link.target);
          if (!src || !tgt) return;

          const thickness = link.value * scale;
          const sy = sourceOffsets.get(link.source) || src.y;
          const ty = targetOffsets.get(link.target) || tgt.y;

          sourceOffsets.set(link.source, sy + thickness);
          targetOffsets.set(link.target, ty + thickness);

          computedLinks.push({
            id: `link-${link.source}-${link.target}`,
            sourceId: link.source,
            targetId: link.target,
            value: link.value,
            colorKey: link.colorKey,
            sy,
            ty,
            thickness,
          });
        });

        return {
          nodes: Array.from(computedNodesMap.values()),
          links: computedLinks,
          totalApps: total,
        };
      }, [applications, SVG_WIDTH, SVG_HEIGHT, MARGIN]);

      // Bezier Path generator for smooth Sankey links
      const renderLinkPath = (link, sourceNode, targetNode) => {
        const x0 = sourceNode.x + sourceNode.width;
        const x1 = targetNode.x;
        const dx = (x1 - x0) * 0.5;

        const y0Top = link.sy;
        const y0Bot = link.sy + link.thickness;
        const y1Top = link.ty;
        const y1Bot = link.ty + link.thickness;

        return `
          M ${x0} ${y0Top}
          C ${x0 + dx} ${y0Top}, ${x1 - dx} ${y1Top}, ${x1} ${y1Top}
          L ${x1} ${y1Bot}
          C ${x1 - dx} ${y1Bot}, ${x0 + dx} ${y0Bot}, ${x0} ${y0Bot}
          Z
        `;
      };

      const handleNodeClick = (node) => {
        const stageMap = {
          root: 'ALL',
          'col1-applied': 'Applied',
          'col1-rejected': 'Rejected',
          'col1-noanswer': 'No Answer',
          'col1-interview': 'Interview',
          'col2-interviewing': 'Interview',
          'col2-nooffer': 'No Offer',
          'col2-offer': 'Offer',
          'col3-pendingoffer': 'Offer',
          'col3-accepted': 'Accepted',
          'col3-declined': 'Declined',
        };
        onSelectStage(stageMap[node.id] || 'ALL');
      };

      const handleMouseMoveTooltip = (e, label, value) => {
        setTooltip({
          show: true,
          x: e.clientX,
          y: e.clientY,
          label,
          value,
        });
      };

      const handleMouseLeaveTooltip = () => {
        setTooltip({ ...tooltip, show: false });
      };

      if (totalApps === 0) {
        return (
          <div className={`w-full h-80 rounded-3xl border flex flex-col items-center justify-center p-8 text-center transition-all ${
            isDark ? 'bg-zinc-900/50 border-zinc-800 text-zinc-400' : 'bg-slate-50 border-slate-200 text-slate-500'
          }`}>
            <Icon name="layers" className="w-12 h-12 mb-3 stroke-1 opacity-50" />
            <h3 className="font-semibold text-base mb-1">No Applications Match Active Filter</h3>
            <p className="text-xs max-w-sm">
              Adjust your role or stage filter to restore application funnel analytics.
            </p>
          </div>
        );
      }

      return (
        <div className={`relative w-full overflow-hidden rounded-3xl border backdrop-blur-xl transition-all ${
          isDark ? 'bg-zinc-900/70 border-zinc-800/90 shadow-2xl shadow-black/50' : 'bg-white/80 border-slate-200/90 shadow-xl shadow-slate-100'
        }`}>
          
          {/* Custom Tooltip */}
          {tooltip.show && (
            <div
              className={`fixed z-50 pointer-events-none px-3.5 py-2.5 rounded-2xl shadow-xl backdrop-blur-md border ${
                isDark ? 'bg-zinc-800/95 border-zinc-700 text-zinc-100' : 'bg-white/95 border-slate-200 text-slate-800'
              }`}
              style={{ left: tooltip.x + 15, top: tooltip.y + 15 }}
            >
              <div className={`text-[11px] font-medium mb-1 ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                {tooltip.label}
              </div>
              <div className="text-sm font-bold flex items-center gap-1.5">
                {tooltip.value} <span className={`text-xs font-normal ${isDark ? 'text-zinc-500' : 'text-slate-400'}`}>applications</span>
              </div>
            </div>
          )}

          {/* Card Header */}
          <div className="px-6 pt-5 pb-3 flex items-center justify-between border-b border-inherit">
            <div className="flex items-center gap-3">
              <div className={`p-2.5 rounded-2xl ${isDark ? 'bg-indigo-500/10 text-indigo-400' : 'bg-indigo-50 text-indigo-600'}`}>
                <Icon name="barChart" className="w-5 h-5" />
              </div>
              <div>
                <h2 className={`font-bold text-base tracking-tight ${isDark ? 'text-zinc-100' : 'text-slate-800'}`}>
                  Application Flow
                </h2>
                <p className={`text-xs ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                  Click any stage to filter your list
                </p>
              </div>
            </div>

            {selectedStageFilter !== 'ALL' && (
              <button
                onClick={() => onSelectStage('ALL')}
                className={`text-xs px-3.5 py-1.5 rounded-xl flex items-center gap-1.5 font-medium transition-all ${
                  isDark
                    ? 'bg-zinc-800 text-zinc-300 hover:bg-zinc-700 hover:text-white'
                    : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                }`}
              >
                <Icon name="refresh" className="w-3.5 h-3.5" />
                Reset Filter ({selectedStageFilter})
              </button>
            )}
          </div>

          {/* SVG Diagram Container */}
          <div className="w-full overflow-x-auto p-4 flex justify-center items-center">
            <svg
              viewBox={`0 0 ${SVG_WIDTH} ${SVG_HEIGHT}`}
              className="w-full h-auto max-w-5xl select-none"
              style={{ maxHeight: '420px' }}
            >
              <defs>
                <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="3" result="blur" />
                  <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                <filter id="glow-dark" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur stdDeviation="5" result="blur" />
                  <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
              </defs>

              {/* Render Links */}
              <g className="sankey-links">
                {links.map((link) => {
                  const src = nodes.find((n) => n.id === link.sourceId);
                  const tgt = nodes.find((n) => n.id === link.targetId);
                  if (!src || !tgt) return null;

                  const isHighlighted =
                    hoveredLinkId === link.id ||
                    hoveredNodeId === link.sourceId ||
                    hoveredNodeId === link.targetId;

                  const colorDef = themePalette[link.colorKey] || themePalette.total;
                  const pathD = renderLinkPath(link, src, tgt);

                  return (
                    <path
                      key={link.id}
                      d={pathD}
                      fill={colorDef.fill}
                      fillOpacity={isHighlighted ? (isDark ? 0.65 : 0.5) : isDark ? 0.28 : 0.2}
                      stroke={colorDef.stroke}
                      strokeWidth={isHighlighted ? 1.5 : 0.5}
                      strokeOpacity={isHighlighted ? 0.9 : 0.3}
                      className="cursor-pointer transition-all duration-200"
                      onMouseMove={(e) => {
                        setHoveredLinkId(link.id);
                        handleMouseMoveTooltip(e, `${src.name} to ${tgt.name}`, link.value);
                      }}
                      onMouseLeave={() => {
                        setHoveredLinkId(null);
                        handleMouseLeaveTooltip();
                      }}
                    />
                  );
                })}
              </g>

              {/* Render Nodes */}
              <g className="sankey-nodes">
                {nodes.map((node) => {
                  const colorDef = themePalette[node.colorKey] || themePalette.total;
                  const isHovered = hoveredNodeId === node.id;
                  const isSelected =
                    (selectedStageFilter !== 'ALL' && node.name.includes(selectedStageFilter)) ||
                    (selectedStageFilter === 'ALL' && node.id === 'root');

                  return (
                    <g
                      key={node.id}
                      transform={`translate(${node.x}, ${node.y})`}
                      className="cursor-pointer group"
                      onMouseMove={(e) => {
                        setHoveredNodeId(node.id);
                        handleMouseMoveTooltip(e, node.name, node.count);
                      }}
                      onMouseLeave={() => {
                        setHoveredNodeId(null);
                        handleMouseLeaveTooltip();
                      }}
                      onClick={() => handleNodeClick(node)}
                    >
                      <rect
                        width={node.width}
                        height={node.height}
                        rx={6}
                        ry={6}
                        fill={colorDef.fill}
                        stroke={isSelected ? (isDark ? '#FFFFFF' : '#000000') : colorDef.stroke}
                        strokeWidth={isSelected || isHovered ? 2.5 : 1.2}
                        className="transition-all duration-200"
                        style={{
                          filter: isHovered ? (isDark ? 'url(#glow-dark)' : 'url(#glow-light)') : 'none',
                        }}
                      />

                      {/* Node Labels positioned consistently to the right of every node */}
                      <g transform={`translate(${node.width + 12}, ${node.height / 2})`}>
                        <text
                          textAnchor="start"
                          alignmentBaseline="middle"
                          dy="0.1em"
                          className={`font-semibold text-xs transition-colors ${

                          }`}
                        >

                        </text>
                      </g>

                  );

    // ==========================================
    // 4. LOCALLY-COMPUTED STAT CARDS
    // ==========================================
    const StatCards = ({ applications, isDark }) => {
      const stats = useMemo(() => {
        const total = applications.length;
        if (total === 0) {
          return { total: 0, interviewRate: 0, offerRate: 0, avgResponseDays: 0, activeCount: 0 };
        }

        const interviewCount = applications.filter((a) =>
          ['Interview', 'No Offer', 'Offer', 'Accepted', 'Declined'].includes(a.stage)
        ).length;

        const offerCount = applications.filter((a) =>
          ['Offer', 'Accepted', 'Declined'].includes(a.stage)
        ).length;

        const interviewRate = Math.round((interviewCount / total) * 100);
        const offerRate = interviewCount > 0 ? Math.round((offerCount / interviewCount) * 100) : 0;

        const appsWithDays = applications.filter((a) => a.responseDays && a.responseDays > 0);
        const avgResponseDays =
          appsWithDays.length > 0
            ? Math.round(appsWithDays.reduce((acc, curr) => acc + (curr.responseDays || 0), 0) / appsWithDays.length)
            : 8;

        const activeCount = applications.filter((a) =>
          ['Applied', 'Interview', 'Offer'].includes(a.stage)
        ).length;

        return {
          total,
          interviewRate,
          offerRate,
          avgResponseDays,
          activeCount,
        };
      }, [applications]);

      const items = [
        {
          title: 'Total Applications',
          value: stats.total.toString(),
          subtitle: `${stats.activeCount} currently active`,
          icon: 'briefcase',
        },
        {
          title: 'Interview Rate',
          value: `${stats.interviewRate}%`,
          subtitle: 'Reached interview stage',
          icon: 'trendingUp',
        },
        {
          title: 'Offer Conversion',
          value: `${stats.offerRate}%`,
          subtitle: 'Interviews converted to offer',
          icon: 'award',
        },
        {
          title: 'Avg. Response Time',
          value: `${stats.avgResponseDays} days`,
          subtitle: 'First reply from employer',
          icon: 'clock',
        },
      ];

      return (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          {items.map((item, idx) => (
            <div
              key={idx}
              className={`p-5 rounded-3xl border backdrop-blur-xl transition-all hover:scale-[1.01] ${
                isDark
                  ? 'bg-zinc-900/70 border-zinc-800/90 shadow-lg shadow-black/20'
                  : 'bg-white/80 border-slate-200/90 shadow-md shadow-slate-100'
              }`}
            >
              <div className="flex items-center justify-between mb-3">
                <span className={`text-[11px] font-semibold uppercase tracking-wider ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                  {item.title}
                </span>
                <div
                  className={`p-2.5 rounded-2xl ${
                    isDark ? 'bg-zinc-800/80 text-zinc-200' : 'bg-slate-100 text-slate-700'
                  }`}
                >
                  <Icon name={item.icon} className="w-4 h-4" />
                </div>
              </div>
              <div className={`text-2xl font-extrabold tracking-tight mb-1 ${isDark ? 'text-zinc-100' : 'text-slate-900'}`}>
                {item.value}
              </div>
              <div className={`text-xs ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>{item.subtitle}</div>

                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold mb-1">Notes</label>
                <textarea
                  rows={2}
                  value={formData.notes || ''}
                  onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                  placeholder="Interview rounds, prep notes, offer details..."
                  className={`w-full px-3 py-2 text-xs rounded-xl border outline-none ${
                    isDark
                      ? 'bg-zinc-800 border-zinc-700 text-zinc-100 focus:border-indigo-500'
                      : 'bg-slate-50 border-slate-200 text-slate-900 focus:border-indigo-500'
                  }`}
                />
              </div>

              <div className="flex justify-end gap-2 pt-4 border-t border-inherit">
                <button
                  type="button"
                  onClick={onClose}
                  className={`px-4 py-2 text-xs font-semibold rounded-xl border transition-colors ${
                    isDark
                      ? 'bg-zinc-800 border-zinc-700 text-zinc-300 hover:bg-zinc-700'
                      : 'bg-slate-100 border-slate-200 text-slate-700 hover:bg-slate-200'
                  }`}
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 text-xs font-semibold rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white shadow-md shadow-indigo-600/30 transition-all active:scale-95"
                >
                  {editingApp ? 'Save Changes' : 'Add Application'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    // ==========================================
    // 8. MAIN APPLICATION CONTAINER
    // ==========================================
    function App() {
      // Theme State with localStorage persistence
      const [isDark, setIsDark] = useState(() => {
        const saved = localStorage.getItem('careertrack_theme');
        if (saved) return saved === 'dark';
        return window.matchMedia('(prefers-color-scheme: dark)').matches;
      });

      // Data state with localStorage persistence
      const [applications, setApplications] = useState(() => {
        const saved = localStorage.getItem('careertrack_apps_v2');
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch (e) {
            return SAMPLE_APPLICATIONS;
          }
        }
        return SAMPLE_APPLICATIONS;
      });

      // Filters State
      const [selectedRole, setSelectedRole] = useState('ALL');
      const [selectedStage, setSelectedStage] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');

      // Modal State
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingApp, setEditingApp] = useState(null);

      // Persist theme
      useEffect(() => {
        localStorage.setItem('careertrack_theme', isDark ? 'dark' : 'light');
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [isDark]);

      // Persist applications data locally
      useEffect(() => {
        localStorage.setItem('careertrack_apps_v2', JSON.stringify(applications));
      }, [applications]);

      // Derived data for Sankey
      const filteredForSankey = useMemo(() => {
        return applications.filter((app) => {
          return selectedRole === 'ALL' || app.roleType === selectedRole;
        });
      }, [applications, selectedRole]);

      // Derived data for Grid
      const filteredForGrid = useMemo(() => {
        return applications.filter((app) => {
          const matchRole = selectedRole === 'ALL' || app.roleType === selectedRole;
          const matchStage = selectedStage === 'ALL' || app.stage === selectedStage;
          const matchSearch =
            !searchQuery ||
            app.company.toLowerCase().includes(searchQuery.toLowerCase()) ||
            app.position.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (app.location && app.location.toLowerCase().includes(searchQuery.toLowerCase()));

          return matchRole && matchStage && matchSearch;
        });
      }, [applications, selectedRole, selectedStage, searchQuery]);

      // Handlers
      const handleSaveApp = (savedApp) => {
        if (editingApp) {
          setApplications((prev) => prev.map((a) => (a.id === savedApp.id ? savedApp : a)));
        } else {
          setApplications((prev) => [savedApp, ...prev]);
        }
        setEditingApp(null);
      };

      const handleDeleteApp = (id) => {
        setApplications((prev) => prev.filter((a) => a.id !== id));
      };

      const handleOpenAdd = () => {
        setEditingApp(null);
        setIsModalOpen(true);
      };

      const handleEditApp = (app) => {
        setEditingApp(app);
        setIsModalOpen(true);
      };

      const handleExportData = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(applications, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `jobtracker_data_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleResetSampleData = () => {
        setApplications(SAMPLE_APPLICATIONS);
        setSelectedRole('ALL');
        setSelectedStage('ALL');
        setSearchQuery('');
      };

      return (
        <div className="min-h-screen transition-colors duration-300 pb-12">
          {/* Top Header */}
          <header
            className={`sticky top-0 z-40 border-b backdrop-blur-md transition-colors ${
              isDark
                ? 'bg-zinc-950/80 border-zinc-800/80'
                : 'bg-white/80 border-slate-200/80'
            }`}
          >
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/25">
                  <Icon name="briefcase" className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="font-extrabold text-base tracking-tight">
                    Job Tracker
                  </h1>
                  <p className={`text-[11px] ${isDark ? 'text-zinc-400' : 'text-slate-500'}`}>
                    Manage your job applications easily
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2.5">
                <button
                  onClick={handleResetSampleData}
                  className={`px-3 py-1.5 rounded-2xl border text-xs font-medium transition-all ${
                    isDark
                      ? 'bg-zinc-900 border-zinc-800 text-zinc-300 hover:bg-zinc-800'
                      : 'bg-slate-100 border-slate-200 text-slate-700 hover:bg-slate-200'
                  }`}
                  title="Reset to Sample Data"
                >
                  Reset Demo
                </button>

                <button
                  onClick={() => setIsDark(!isDark)}
                  className={`p-2 rounded-2xl border transition-all flex items-center gap-2 text-xs font-medium ${
                    isDark
                      ? 'bg-zinc-900 border-zinc-800 text-amber-400 hover:bg-zinc-800'
                      : 'bg-slate-100 border-slate-200 text-slate-700 hover:bg-slate-200'
                  }`}
                  title="Toggle Theme Mode"
                >
                  <Icon name={isDark ? "sun" : "moon"} className="w-4 h-4 text-indigo-500" />
                  <span className="hidden sm:inline">{isDark ? 'Light' : 'Dark'}</span>
                </button>
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
            {/* Stat Cards */}
            <StatCards applications={filteredForSankey} isDark={isDark} />

            {/* Custom SVG Sankey Diagram */}
            <CustomSankeyChart
              applications={filteredForSankey}
              isDark={isDark}
              selectedStageFilter={selectedStage}
              onSelectStage={setSelectedStage}
            />

            {/* Filter Toolbar */}
            <FilterToolbar
              selectedRole={selectedRole}
              onSelectRole={setSelectedRole}
              selectedStage={selectedStage}
              onSelectStage={setSelectedStage}
              searchQuery={searchQuery}
              onSearchChange={setSearchQuery}
              isDark={isDark}
              onOpenAddModal={handleOpenAdd}
              onExportData={handleExportData}
              onResetSampleData={handleResetSampleData}
            />

            {/* Applications Table / Grid */}
            <JobGrid
              applications={filteredForGrid}
              isDark={isDark}
              onEdit={handleEditApp}
              onDelete={handleDeleteApp}
            />
          </main>

          {/* Add / Edit Modal */}
          <AddEditModal
            isOpen={isModalOpen}
            onClose={() => setIsModalOpen(false)}
            onSave={handleSaveApp}
            editingApp={editingApp}
            isDark={isDark}
          />
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
